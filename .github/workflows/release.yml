name: Build and Release

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      changed: ${{ steps.check.outputs.changed }}
      old_version: ${{ steps.check.outputs.old_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - id: get_version
        name: Get current version
        run: echo "version=$(sed -n 's/^version\s*=\s*"\([^"]*\)"/\1/p' Cargo.toml | head -1)" >> $GITHUB_OUTPUT

      - id: check
        name: Check if version changed
        run: |
          git show HEAD~1:Cargo.toml > old_Cargo.toml 2>/dev/null || true
          old_version=$(sed -n 's/^version\s*=\s*"\([^"]*\)"/\1/p' old_Cargo.toml | head -1 || echo "")
          new_version=${{ steps.get_version.outputs.version }}
          rm -f old_Cargo.toml
          if [ "$old_version" != "$new_version" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "old_version=$old_version" >> $GITHUB_OUTPUT
            echo "Version changed: $old_version -> $new_version"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Version unchanged: $new_version"
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: rustracker-linux
            binary: rustracker
            cargo_flags: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: rustracker-linux-nodashboard
            binary: rustracker
            cargo_flags: "--no-default-features"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: rustracker.exe
            binary: rustracker.exe
            cargo_flags: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.cargo_flags }}

      - name: Setup Node
        if: matrix.cargo_flags == ''
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: matrix.cargo_flags == ''
        working-directory: frontend
        run: npm ci

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: RUSTFLAGS="-C target-cpu=x86-64-v2" cargo build --release --target ${{ matrix.target }} ${{ matrix.cargo_flags }}

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: cargo build --release --target ${{ matrix.target }} ${{ matrix.cargo_flags }}

      - name: Rename Linux binary
        if: matrix.os == 'ubuntu-latest'
        run: mv target/${{ matrix.target }}/release/${{ matrix.binary }} target/${{ matrix.target }}/release/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}

  release:
    needs: [check-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Linux binary
        uses: actions/download-artifact@v8
        with:
          name: rustracker-linux
          path: release/

      - name: Download Linux nodashboard binary
        uses: actions/download-artifact@v8
        with:
          name: rustracker-linux-nodashboard
          path: release/

      - name: Download Windows binary
        uses: actions/download-artifact@v8
        with:
          name: rustracker.exe
          path: release/

      - name: Copy install script
        run: cp install-linux.sh release/

      - name: Create Linux package
        run: |
          mkdir -p rustracker-linux
          cp release/rustracker-linux rustracker-linux/
          cp release/install-linux.sh rustracker-linux/
          tar -czf rustracker-linux.tar.gz rustracker-linux

      - name: Install OpenCode CLI
        run: npm install -g opencode-ai

      - name: Generate release notes
        id: changelog
        run: |
          version="${{ needs.check-version.outputs.version }}"
          old_version="${{ needs.check-version.outputs.old_version }}"
          if [ -n "$old_version" ] && git rev-parse "v${old_version}" >/dev/null 2>&1; then
            prev_tag="v${old_version}"
          else
            prev_tag=$(git tag --sort=-v:refname | head -1 || true)
          fi
          if [ -n "$prev_tag" ] && git rev-parse "$prev_tag" >/dev/null 2>&1; then
            log=$(git log ${prev_tag}..HEAD --pretty=format:"- %s" --no-merges | grep -vE '^- [0-9]+\.[0-9]+\.[0-9]+$')
          else
            log=$(git log --pretty=format:"- %s" --no-merges | grep -vE '^- [0-9]+\.[0-9]+\.[0-9]+$')
          fi
          if [ -z "$log" ]; then
            log="- 代码优化和修复"
          fi
          printf '%s\n' "$log" > /tmp/commits.txt
          timeout 60 opencode run "Based on these commits, generate concise release notes in Chinese for v${version}. Group by: 新功能、Bug 修复、重构优化、文档。 Output markdown only, no explanations.

          $(cat /tmp/commits.txt)" > /tmp/notes.md 2>/dev/null || true
          echo "en<<EOF" >> $GITHUB_OUTPUT
          printf '%s\n' "$log" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "cn<<EOF" >> $GITHUB_OUTPUT
          if [ -s /tmp/notes.md ]; then
            printf '%s\n' "$(cat /tmp/notes.md)" >> $GITHUB_OUTPUT
          else
            printf '%s\n' "$log" >> $GITHUB_OUTPUT
          fi
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: v${{ needs.check-version.outputs.version }}
          body: |
            ## rustracker v${{ needs.check-version.outputs.version }}

            ### What's Changed
            ${{ steps.changelog.outputs.en }}

            ### Downloads
            - `rustracker-linux.tar.gz` — Linux full package (binary + installer)
            - `rustracker-linux` — Linux x86_64 binary (with dashboard)
            - `rustracker-linux-nodashboard` — Linux x86_64 binary (tracker only, no web UI)
            - `rustracker.exe` — Windows x86_64 binary

            ### Linux Installation
            ```bash
            tar -xzf rustracker-linux.tar.gz
            cd rustracker-linux
            sudo sh install-linux.sh
            ```

            ---

            ## rustracker v${{ needs.check-version.outputs.version }}

            ### 更新内容
            ${{ steps.changelog.outputs.cn }}

            ### 下载
            - `rustracker-linux.tar.gz` — Linux 完整包（含二进制和安装脚本）
            - `rustracker-linux` — Linux 64位二进制（含面板）
            - `rustracker-linux-nodashboard` — Linux 64位二进制（纯 Tracker，无 Web 面板）
            - `rustracker.exe` — Windows 64位二进制

            ### Linux 安装
            ```bash
            tar -xzf rustracker-linux.tar.gz
            cd rustracker-linux
            sudo sh install-linux.sh
            ```
          files: |
            release/rustracker-linux
            release/rustracker-linux-nodashboard
            release/rustracker.exe
            rustracker-linux.tar.gz
          draft: false
          prerelease: false
