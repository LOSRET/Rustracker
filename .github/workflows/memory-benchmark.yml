name: Memory Benchmark

on:
  workflow_dispatch:

jobs:
  tracker-btree:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --example memory_tracker_bench
      - name: Run
        run: cargo run --release --example memory_tracker_bench 2>bench.log | tee results.csv
      - name: Show summary
        run: cat bench.log
      - name: Render
        run: |
          echo "## Real Tracker RSS Curve (BTreeMap, 10M torrents / 25M peers)" >> $GITHUB_STEP_SUMMARY
          echo "| Torrents | Peers | RSS | ΔRSS |" >> $GITHUB_STEP_SUMMARY
          echo "|---:|---:|---:|---:|" >> $GITHUB_STEP_SUMMARY
          tail -n +2 results.csv | while IFS=',' read _ t p rss delta; do
            echo "| $(printf "%'d" $t) | $(printf "%'d" $p) | ${rss} MB | ${delta} MB |" >> $GITHUB_STEP_SUMMARY
          done
      - uses: actions/upload-artifact@v4
        with: { name: btree-bench, path: results.csv }

  rps-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --example rps_bench
      - name: Run
        run: cargo run --release --example rps_bench 2>rps.log | tee rps.csv
      - name: Show summary
        run: cat rps.log
      - name: Render
        run: |
          echo "## Announce RPS by Peer Scale" >> $GITHUB_STEP_SUMMARY
          echo "| Peers | RPS | Elapsed | RSS |" >> $GITHUB_STEP_SUMMARY
          echo "|---:|---:|---:|---:|" >> $GITHUB_STEP_SUMMARY
          tail -n +2 rps.csv | while IFS=',' read peers rps elapsed rss; do
            echo "| $(printf "%'d" $peers) | $(printf "%'.0f" $rps) | ${elapsed} ms | ${rss} MB |" >> $GITHUB_STEP_SUMMARY
          done
      - uses: actions/upload-artifact@v4
        with: { name: rps-bench, path: rps.csv }
