name: Benchmark

on:
  workflow_dispatch:

jobs:
  unified-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --example unified_bench
      - name: Run
        run: cargo run --release --example unified_bench 2>bench.log | tee bench.csv
      - name: Show log
        run: cat bench.log
      - name: Summary
        run: |
          echo "# Unified Benchmark (memory + RPS + CPU + latency)" >> $GITHUB_STEP_SUMMARY
          echo "| Requests | Torrents | Peers | New Joins | Re-announces | RPS | Win RPS | RSS | CPU% | Avg | P50 | P99 | Max |" >> $GITHUB_STEP_SUMMARY
          echo "|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|" >> $GITHUB_STEP_SUMMARY
          tail -n +2 bench.csv | while IFS=',' read req torrents peers new re rps win_rps rss cpu avg p50 p99 maxlat; do
            avg_ms=$(awk "BEGIN{printf \"%.1f\", $avg/1000}")
            p50_ms=$(awk "BEGIN{printf \"%.1f\", $p50/1000}")
            p99_ms=$(awk "BEGIN{printf \"%.1f\", $p99/1000}")
            max_ms=$(awk "BEGIN{printf \"%.1f\", $maxlat/1000}")
            echo "| $(printf "%'d" $req) | $(printf "%'d" $torrents) | $(printf "%'d" $peers) | $(printf "%'d" $new) | $(printf "%'d" $re) | $(printf "%'.0f" $rps) | $(printf "%'.0f" $win_rps) | ${rss} MB | ${cpu}% | ${avg_ms} ms | ${p50_ms} ms | ${p99_ms} ms | ${max_ms} ms |" >> $GITHUB_STEP_SUMMARY
          done
      - uses: actions/upload-artifact@v7
        with: { name: benchmark, path: bench.csv }

  allocator-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (system allocator)
        run: cargo build --release --example memory_tracker_bench
      - name: Build (jemalloc)
        run: cargo build --release --example memory_jemalloc_bench
      - name: Run system allocator
        run: cargo run --release --example memory_tracker_bench 2>sys.log | tee sys.csv
      - name: Run jemalloc
        run: cargo run --release --example memory_jemalloc_bench 2>jem.log | tee jem.csv
      - name: Show logs
        run: |
          echo "=== system allocator ===" && cat sys.log
          echo "=== jemalloc ===" && cat jem.log
      - name: Summary
        run: |
          # Build side-by-side per-sample CSV: torrents,peers,system_rss,jemalloc_rss,delta
          # tail skips CSV header, cut extracts torrents_done + rss_mb columns, paste joins them
          paste -d',' \
            <(tail -n +2 sys.csv | awk -F',' '{print $2","$3","$4}') \
            <(tail -n +2 jem.csv | awk -F',' '{print $4}') \
            > compare.csv

          echo "# Allocator Comparison: system vs jemalloc" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## RSS Growth Curve (per sample)" >> $GITHUB_STEP_SUMMARY
          echo "| Torrents | Peers | system RSS | jemalloc RSS | Delta | Delta % |" >> $GITHUB_STEP_SUMMARY
          echo "|---:|---:|---:|---:|---:|---:|" >> $GITHUB_STEP_SUMMARY

          while IFS=',' read torrents peers sys_rss jem_rss; do
            delta=$(awk "BEGIN{printf \"%.1f\", $jem_rss - $sys_rss}")
            pct=$(awk "BEGIN{printf \"%.1f\", ($jem_rss - $sys_rss) / $sys_rss * 100}")
            echo "| $(printf "%'d" $torrents) | $(printf "%'d" $peers) | ${sys_rss} MB | ${jem_rss} MB | ${delta} MB | ${pct}% |" >> $GITHUB_STEP_SUMMARY
          done < compare.csv

          echo "" >> $GITHUB_STEP_SUMMARY

          # Final aggregate
          sys_final=$(grep "done" sys.log | grep -oP 'rss=\K[0-9.]+')
          jem_final=$(grep "done" jem.log | grep -oP 'rss=\K[0-9.]+')
          sys_peak=$(tail -n +2 sys.csv | awk -F',' '{print $4}' | sort -rn | head -1)
          jem_peak=$(tail -n +2 jem.csv | awk -F',' '{print $4}' | sort -rn | head -1)

          echo "## Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | system | jemalloc | Delta |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---:|---:|---:|" >> $GITHUB_STEP_SUMMARY

          if [ -n "$sys_final" ] && [ -n "$jem_final" ]; then
            fd=$(awk "BEGIN{printf \"%.1f\", $jem_final - $sys_final}")
            echo "| Final RSS | ${sys_final} MB | ${jem_final} MB | ${fd} MB |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -n "$sys_peak" ] && [ -n "$jem_peak" ]; then
            pd=$(awk "BEGIN{printf \"%.1f\", $jem_peak - $sys_peak}")
            echo "| Peak RSS | ${sys_peak} MB | ${jem_peak} MB | ${pd} MB |" >> $GITHUB_STEP_SUMMARY
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: allocator-compare-data
          path: |
            sys.csv
            sys.log
            jem.csv
            jem.log
            compare.csv
