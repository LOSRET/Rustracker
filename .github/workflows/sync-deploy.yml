name: 自用部署

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - id: check
        name: Check if version changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Manual trigger - building regardless"
            exit 0
          fi
          git show HEAD~1:Cargo.toml > old.toml 2>/dev/null || true
          old=$(grep '^version' old.toml | head -1 | sed 's/.*"\(.*\)".*/\1/' || echo "")
          new=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          rm -f old.toml
          if [ "$old" != "$new" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Version changed: $old -> $new"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

  build-linux:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        run: RUSTFLAGS="-C target-cpu=x86-64-v2" cargo build --release --target x86_64-unknown-linux-gnu --features personal-contact
        env:
          VITE_PERSONAL_CONTACT: "true"

      - name: Package
        run: |
          mkdir -p pkg
          cp target/x86_64-unknown-linux-gnu/release/rustracker pkg/rustracker-linux
          cp install-linux.sh pkg/
          tar -czf rustracker-selfuse.tar.gz -C pkg rustracker-linux install-linux.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: rustracker-selfuse-linux
          path: rustracker-selfuse.tar.gz

  build-windows:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        run: cargo build --release --features personal-contact
        env:
          VITE_PERSONAL_CONTACT: "true"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: rustracker-selfuse-windows
          path: target/release/rustracker.exe
