name: Shrink/Regrow Benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/core/swarm.rs"

env:
  # Shorten jemalloc decay from default 10s to 2s so freed pages are
  # returned to the OS before the next RSS measurement (the benchmark
  # only waits 3s after shrink_to before sampling RSS).
  MALLOC_CONF: "dirty_decay_ms:2000,muzzy_decay_ms:2000"

jobs:
  shrink-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --no-default-features --example shrink_bench
      - name: Run
        run: cargo run --release --no-default-features --example shrink_bench 2>shrink.log | tee shrink.csv
      - name: Show log
        run: cat shrink.log
      - name: Summary
        run: |
          echo "# Shrink/Regrow Memory Benchmark" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Cycle | Torrents | Build RSS | Peers after expire | Shrink RSS | Regrow RSS | Overhead |" >> $GITHUB_STEP_SUMMARY
          echo "|---:|---:|---:|---:|---:|---:|---:|" >> $GITHUB_STEP_SUMMARY
          tail -n +2 shrink.csv | while IFS=',' read cycle torrents build peers shrink regrow overhead; do
            echo "| $cycle | $(printf "%'d" $torrents) | ${build} MB | $(printf "%'d" $peers) | ${shrink} MB | ${regrow} MB | ${overhead} MB |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          final=$(tail -1 shrink.csv | awk -F',' '{print $5}')
          initial=$(tail -1 shrink.csv | awk -F',' '{print $3}')
          growth=$(awk "BEGIN{printf \"%.1f\", $final - $initial}")
          echo "**Final overhead: ${growth} MB** (build RSS vs last regrow RSS)" >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7
        with: { name: shrink-bench, path: shrink.csv }
