[package]
name = "rustracker"
version = "0.2.9"
edition = "2021"
description = "A minimal HTTP BitTorrent tracker written in Rust"
license = "MIT"

[features]
default = ["dashboard"]
dashboard = []
personal-contact = []

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["tokio", "http1"] }
clap = { version = "4.5", features = ["derive", "env"] }
http-body-util = "0.1"
percent-encoding = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.38", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
hyper = "1.4"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde_json = "1.0"

[target.'cfg(target_os = "linux")'.dev-dependencies]
tikv-jemallocator = { version = "0.6", features = ["background_threads"] }
