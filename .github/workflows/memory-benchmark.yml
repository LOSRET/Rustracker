name: Benchmark

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --example memory_tracker_bench --example rps_bench

      - name: Memory benchmark
        run: cargo run --release --example memory_tracker_bench 2>mem.log | tee mem.csv
      - name: RPS benchmark
        run: cargo run --release --example rps_bench 2>rps.log | tee rps.csv

      - name: Summary
        run: |
          echo "# Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## RSS Curve (10M torrents / 25M peers)" >> $GITHUB_STEP_SUMMARY
          echo "| Torrents | Peers | RSS | ΔRSS |" >> $GITHUB_STEP_SUMMARY
          echo "|---:|---:|---:|---:|" >> $GITHUB_STEP_SUMMARY
          tail -n +2 mem.csv | while IFS=',' read _ t p rss delta; do
            echo "| $(printf "%'d" $t) | $(printf "%'d" $p) | ${rss} MB | ${delta} MB |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Announce RPS by Peer Scale" >> $GITHUB_STEP_SUMMARY
          echo "| Peers | RPS | Elapsed | RSS |" >> $GITHUB_STEP_SUMMARY
          echo "|---:|---:|---:|---:|" >> $GITHUB_STEP_SUMMARY
          tail -n +2 rps.csv | while IFS=',' read peers rps elapsed rss; do
            echo "| $(printf "%'d" $peers) | $(printf "%'.0f" $rps) | ${elapsed} ms | ${rss} MB |" >> $GITHUB_STEP_SUMMARY
          done

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            mem.csv
            rps.csv
