name: Memory Benchmark (Real Tracker)

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --example memory_tracker_bench

      - name: Run real-tracker memory benchmark
        run: cargo run --release --example memory_tracker_bench 2>bench.log | tee results.csv

      - name: Show summary
        run: cat bench.log

      - name: Render results table
        run: |
          echo "## Tracker RSS Growth Curve" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Torrents | Peers | RSS | ΔRSS |" >> $GITHUB_STEP_SUMMARY
          echo "|---:|---:|---:|---:|" >> $GITHUB_STEP_SUMMARY
          tail -n +2 results.csv | while IFS=',' read torrents peers rss delta; do
            torrents_fmt=$(printf "%'d" $torrents)
            peers_fmt=$(printf "%'d" $peers)
            echo "| ${torrents_fmt} | ${peers_fmt} | ${rss} MB | ${delta} MB |" >> $GITHUB_STEP_SUMMARY
          done

      - name: Check for memory jumps
        run: |
          MAX_JUMP=0
          tail -n +2 results.csv | while IFS=',' read _ _ _ delta; do
            delta_num=$(echo "$delta" | sed 's/ MB//')
            if [ "$(echo "$delta_num > $MAX_JUMP" | bc -l 2>/dev/null || echo 0)" = "1" ]; then
              MAX_JUMP=$delta_num
            fi
          done
          echo "Max single-step RSS jump: ${MAX_JUMP} MB"

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: tracker-memory-benchmark
          path: |
            results.csv
            bench.log
