name: Sync self-use branch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync self-use branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git show-ref --verify --quiet refs/heads/self-use; then
            echo "self-use branch exists, rebasing..."
            git checkout self-use
            git rebase main
          else
            echo "self-use branch not found, creating from main..."
            git checkout -b self-use
          fi

          git push origin self-use --force
