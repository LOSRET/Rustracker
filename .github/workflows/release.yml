name: Build and Release

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: get_version
        name: Get current version
        run: echo "version=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')" >> $GITHUB_OUTPUT

      - id: check
        name: Check if version changed
        run: |
          git show HEAD~1:Cargo.toml > old_Cargo.toml 2>/dev/null || true
          old_version=$(grep '^version' old_Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/' || echo "")
          new_version=${{ steps.get_version.outputs.version }}
          rm -f old_Cargo.toml
          if [ "$old_version" != "$new_version" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Version changed: $old_version -> $new_version"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Version unchanged: $new_version"
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: rustracker-linux
            binary: rustracker
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: rustracker.exe
            binary: rustracker.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename Linux binary
        if: matrix.os == 'ubuntu-latest'
        run: mv target/${{ matrix.target }}/release/${{ matrix.binary }} target/${{ matrix.target }}/release/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}

  release:
    needs: [check-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: rustracker-linux
          path: release/

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: rustracker.exe
          path: release/

      - name: Copy install script
        run: cp install-linux.sh release/

      - name: Create Linux package
        run: |
          mkdir -p rustracker-linux
          cp release/rustracker-linux rustracker-linux/
          cp release/install-linux.sh rustracker-linux/
          tar -czf rustracker-linux.tar.gz rustracker-linux

      - name: Get changelog
        id: changelog
        run: |
          # 获取上一个版本 tag
          prev_tag=$(git tag --sort=-creatordate | head -2 | tail -1)
          if [ -z "$prev_tag" ]; then
            # 没有 tag，获取所有 commit
            changelog=$(git log --pretty=format:"- %s" --no-merges)
          else
            # 获取两个版本之间的 commit
            changelog=$(git log ${prev_tag}..HEAD --pretty=format:"- %s" --no-merges)
          fi
          # 多行内容写入环境变量
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$changelog" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: v${{ needs.check-version.outputs.version }}
          body: |
            ## rustracker v${{ needs.check-version.outputs.version }}

            ### 更新内容
            ${{ steps.changelog.outputs.changelog }}

            ### 下载
            - `rustracker-linux.tar.gz` - Linux 完整包（含二进制和安装脚本）
            - `rustracker-linux` - Linux 64位二进制
            - `rustracker.exe` - Windows 64位二进制

            ### Linux 安装
            ```bash
            tar -xzf rustracker-linux.tar.gz
            cd rustracker-linux
            sudo sh install-linux.sh
            ```
          files: |
            release/rustracker-linux
            release/rustracker.exe
            rustracker-linux.tar.gz
          draft: false
          prerelease: false
