name: 自用构建 不建议部署

on:
  push:
    branches: [self-use]
    paths:
      - 'Cargo.toml'

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: self-use
          fetch-depth: 2

      - id: get_version
        name: Get current version
        run: echo "version=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')" >> $GITHUB_OUTPUT

      - id: check
        name: Check if version changed
        run: |
          git show HEAD~1:Cargo.toml > old_Cargo.toml 2>/dev/null || true
          old_version=$(grep '^version' old_Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/' || echo "")
          new_version=${{ steps.get_version.outputs.version }}
          rm -f old_Cargo.toml
          if [ "$old_version" != "$new_version" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Version changed: $old_version -> $new_version"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Version unchanged: $new_version"
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: rustracker-linux
            binary: rustracker
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: rustracker.exe
            binary: rustracker.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: self-use

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: RUSTFLAGS="-C target-cpu=x86-64-v2" cargo build --release --target ${{ matrix.target }}

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename Linux binary
        if: matrix.os == 'ubuntu-latest'
        run: mv target/${{ matrix.target }}/release/${{ matrix.binary }} target/${{ matrix.target }}/release/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-deploy
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}
