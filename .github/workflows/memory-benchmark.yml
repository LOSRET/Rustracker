name: Memory Benchmark

on:
  workflow_dispatch:

jobs:
  # ── Real tracker benchmark (announce/expire path) ───────────────
  tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --example memory_tracker_bench

      - name: Run real-tracker memory benchmark
        run: cargo run --release --example memory_tracker_bench 2>bench.log | tee results.csv

      - name: Show summary
        run: cat bench.log

      - name: Render results
        run: |
          echo "## Real Tracker RSS Curve (DashMap, 10M torrents / 25M peers)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Torrents | Peers | RSS | ΔRSS |" >> $GITHUB_STEP_SUMMARY
          echo "|---:|---:|---:|---:|" >> $GITHUB_STEP_SUMMARY
          tail -n +2 results.csv | while IFS=',' read _ torrents peers rss delta; do
            echo "| $(printf "%'d" $torrents) | $(printf "%'d" $peers) | ${rss} MB | ${delta} MB |" >> $GITHUB_STEP_SUMMARY
          done

      - name: Check jumps
        run: |
          tail -n +2 results.csv | while IFS=',' read label _ _ _ delta; do
            d=$(echo "$delta" | sed 's/ MB//')
            if [ "$(echo "$d > 5" | bc -l 2>/dev/null || echo 0)" = "1" ]; then
              echo "⚠️  ${label} ΔRSS=${delta}"
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: tracker-bench
          path: results.csv

  # ── DashMap vs BTreeMap container comparison ───────────────────
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --example memory_ci_compare

      - name: Run container comparison
        run: cargo run --release --example memory_ci_compare | tee compare.csv

      - name: Render comparison
        run: |
          echo "## DashMap vs BTreeMap Container Memory" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Type | Torrents | Peers | BTreeMap | DashMap | Diff | Diff% | BT Time | DM Time |" >> $GITHUB_STEP_SUMMARY
          echo "|---:|---:|---:|---:|---:|---:|---:|---:|---:|" >> $GITHUB_STEP_SUMMARY
          tail -n +2 compare.csv | while IFS=',' read typ scale torrents peers bt dm diff pct bt_sec dm_sec; do
            echo "| ${typ} | $(printf "%'d" $scale) | $(printf "%'d" $peers) | ${bt} MB | ${dm} MB | ${diff} MB | ${pct}% | ${bt_sec}s | ${dm_sec}s |" >> $GITHUB_STEP_SUMMARY
          done

      - uses: actions/upload-artifact@v4
        with:
          name: container-compare
          path: compare.csv
