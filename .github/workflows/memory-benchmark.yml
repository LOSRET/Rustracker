name: Benchmark

on:
  workflow_dispatch:

jobs:
  unified-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --no-default-features --example unified_bench
      - name: Run
        run: cargo run --release --no-default-features --example unified_bench 2>bench.log | tee bench.csv
      - name: Show log
        run: cat bench.log
      - name: Summary
        run: |
          echo "# Unified Benchmark (memory + RPS + CPU + latency)" >> $GITHUB_STEP_SUMMARY
          echo "| Requests | Torrents | Peers | New Joins | Re-announces | RPS | Win RPS | RSS | CPU% | Avg | P50 | P99 | Max |" >> $GITHUB_STEP_SUMMARY
          echo "|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|" >> $GITHUB_STEP_SUMMARY
          tail -n +2 bench.csv | while IFS=',' read req torrents peers new re rps win_rps rss cpu avg p50 p99 maxlat; do
            avg_ms=$(awk "BEGIN{printf \"%.1f\", $avg/1000}")
            p50_ms=$(awk "BEGIN{printf \"%.1f\", $p50/1000}")
            p99_ms=$(awk "BEGIN{printf \"%.1f\", $p99/1000}")
            max_ms=$(awk "BEGIN{printf \"%.1f\", $maxlat/1000}")
            echo "| $(printf "%'d" $req) | $(printf "%'d" $torrents) | $(printf "%'d" $peers) | $(printf "%'d" $new) | $(printf "%'d" $re) | $(printf "%'.0f" $rps) | $(printf "%'.0f" $win_rps) | ${rss} MB | ${cpu}% | ${avg_ms} ms | ${p50_ms} ms | ${p99_ms} ms | ${max_ms} ms |" >> $GITHUB_STEP_SUMMARY
          done
      - uses: actions/upload-artifact@v7
        with: { name: benchmark, path: bench.csv }

  allocator-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (system allocator)
        run: cargo build --release --no-default-features --example memory_tracker_bench
      - name: Build (jemalloc)
        run: cargo build --release --no-default-features --example memory_jemalloc_bench
      - name: Build (mimalloc)
        run: cargo build --release --no-default-features --example memory_mimalloc_bench
      - name: Run system allocator
        run: /usr/bin/time -v -o sys.time cargo run --release --no-default-features --example memory_tracker_bench 2>sys.log | tee sys.csv
      - name: Run jemalloc
        run: /usr/bin/time -v -o jem.time cargo run --release --no-default-features --example memory_jemalloc_bench 2>jem.log | tee jem.csv
      - name: Run mimalloc
        run: /usr/bin/time -v -o mim.time cargo run --release --no-default-features --example memory_mimalloc_bench 2>mim.log | tee mim.csv
      - name: Show logs
        run: |
          echo "=== system allocator ===" && cat sys.log
          echo "=== system time ===" && cat sys.time
          echo "=== jemalloc ===" && cat jem.log
          echo "=== jemalloc time ===" && cat jem.time
          echo "=== mimalloc ===" && cat mim.log
          echo "=== mimalloc time ===" && cat mim.time
      - name: Summary
        run: |
          # Build side-by-side per-sample CSV: torrents,peers,system_rss,jemalloc_rss,mimalloc_rss
          paste -d',' \
            <(tail -n +2 sys.csv | awk -F',' '{print $2","$3","$4}') \
            <(tail -n +2 jem.csv | awk -F',' '{print $4}') \
            <(tail -n +2 mim.csv | awk -F',' '{print $4}') \
            > compare.csv

          echo "# Allocator Comparison: system vs jemalloc vs mimalloc" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # ── CPU / time ──
          sys_user=$(grep "User time" sys.time | grep -oP '[0-9.]+')
          sys_sys=$(grep "System time" sys.time | grep -oP '[0-9.]+')
          sys_elapsed=$(grep "Elapsed" sys.time | awk '{print $NF}')
          sys_cpu=$(grep "Percent of CPU" sys.time | grep -oP '[0-9]+' | head -1)

          jem_user=$(grep "User time" jem.time | grep -oP '[0-9.]+')
          jem_sys=$(grep "System time" jem.time | grep -oP '[0-9.]+')
          jem_elapsed=$(grep "Elapsed" jem.time | awk '{print $NF}')
          jem_cpu=$(grep "Percent of CPU" jem.time | grep -oP '[0-9]+' | head -1)

          mim_user=$(grep "User time" mim.time | grep -oP '[0-9.]+')
          mim_sys=$(grep "System time" mim.time | grep -oP '[0-9.]+')
          mim_elapsed=$(grep "Elapsed" mim.time | awk '{print $NF}')
          mim_cpu=$(grep "Percent of CPU" mim.time | grep -oP '[0-9]+' | head -1)

          echo "## CPU & Time" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | system | jemalloc | mimalloc | jemalloc Δ | mimalloc Δ |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---:|---:|---:|---:|---:|" >> $GITHUB_STEP_SUMMARY

          if [ -n "$sys_elapsed" ] && [ -n "$jem_elapsed" ] && [ -n "$mim_elapsed" ]; then
            echo "| Elapsed | ${sys_elapsed} | ${jem_elapsed} | ${mim_elapsed} | | |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -n "$sys_user" ] && [ -n "$jem_user" ] && [ -n "$mim_user" ]; then
            jem_delta=$(awk "BEGIN{printf \"%.1f\", $jem_user - $sys_user}")
            mim_delta=$(awk "BEGIN{printf \"%.1f\", $mim_user - $sys_user}")
            echo "| User CPU | ${sys_user}s | ${jem_user}s | ${mim_user}s | ${jem_delta}s | ${mim_delta}s |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -n "$sys_sys" ] && [ -n "$jem_sys" ] && [ -n "$mim_sys" ]; then
            jem_delta=$(awk "BEGIN{printf \"%.1f\", $jem_sys - $sys_sys}")
            mim_delta=$(awk "BEGIN{printf \"%.1f\", $mim_sys - $sys_sys}")
            echo "| Sys CPU | ${sys_sys}s | ${jem_sys}s | ${mim_sys}s | ${jem_delta}s | ${mim_delta}s |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -n "$sys_user" ] && [ -n "$sys_sys" ] && [ -n "$jem_user" ] && [ -n "$jem_sys" ] && [ -n "$mim_user" ] && [ -n "$mim_sys" ]; then
            sys_total=$(awk "BEGIN{printf \"%.1f\", $sys_user + $sys_sys}")
            jem_total=$(awk "BEGIN{printf \"%.1f\", $jem_user + $jem_sys}")
            mim_total=$(awk "BEGIN{printf \"%.1f\", $mim_user + $mim_sys}")
            jem_delta=$(awk "BEGIN{printf \"%.1f\", $jem_total - $sys_total}")
            mim_delta=$(awk "BEGIN{printf \"%.1f\", $mim_total - $sys_total}")
            echo "| Total CPU | ${sys_total}s | ${jem_total}s | ${mim_total}s | ${jem_delta}s | ${mim_delta}s |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -n "$sys_cpu" ] && [ -n "$jem_cpu" ] && [ -n "$mim_cpu" ]; then
            jem_delta=$(awk "BEGIN{printf \"%.0f\", $jem_cpu - $sys_cpu}")
            mim_delta=$(awk "BEGIN{printf \"%.0f\", $mim_cpu - $sys_cpu}")
            echo "| CPU % | ${sys_cpu}% | ${jem_cpu}% | ${mim_cpu}% | ${jem_delta}% | ${mim_delta}% |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          # ── RSS growth curve ──
          echo "## RSS Growth Curve (per sample)" >> $GITHUB_STEP_SUMMARY
          echo "| Torrents | Peers | system RSS | jemalloc RSS | jemalloc Δ | jemalloc Δ % | mimalloc RSS | mimalloc Δ | mimalloc Δ % |" >> $GITHUB_STEP_SUMMARY
          echo "|---:|---:|---:|---:|---:|---:|---:|---:|---:|" >> $GITHUB_STEP_SUMMARY

          while IFS=',' read torrents peers sys_rss jem_rss mim_rss; do
            jem_delta=$(awk "BEGIN{printf \"%.1f\", $jem_rss - $sys_rss}")
            jem_pct=$(awk "BEGIN{printf \"%.1f\", ($jem_rss - $sys_rss) / $sys_rss * 100}")
            mim_delta=$(awk "BEGIN{printf \"%.1f\", $mim_rss - $sys_rss}")
            mim_pct=$(awk "BEGIN{printf \"%.1f\", ($mim_rss - $sys_rss) / $sys_rss * 100}")
            echo "| $(printf "%'d" $torrents) | $(printf "%'d" $peers) | ${sys_rss} MB | ${jem_rss} MB | ${jem_delta} MB | ${jem_pct}% | ${mim_rss} MB | ${mim_delta} MB | ${mim_pct}% |" >> $GITHUB_STEP_SUMMARY
          done < compare.csv

          echo "" >> $GITHUB_STEP_SUMMARY

          # ── Final aggregate ──
          sys_final=$(grep "done" sys.log | grep -oP 'rss=\K[0-9.]+')
          jem_final=$(grep "done" jem.log | grep -oP 'rss=\K[0-9.]+')
          mim_final=$(grep "done" mim.log | grep -oP 'rss=\K[0-9.]+')
          sys_peak=$(tail -n +2 sys.csv | awk -F',' '{print $4}' | sort -rn | head -1)
          jem_peak=$(tail -n +2 jem.csv | awk -F',' '{print $4}' | sort -rn | head -1)
          mim_peak=$(tail -n +2 mim.csv | awk -F',' '{print $4}' | sort -rn | head -1)

          echo "## Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | system | jemalloc | mimalloc | jemalloc Δ | mimalloc Δ |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---:|---:|---:|---:|---:|" >> $GITHUB_STEP_SUMMARY

          if [ -n "$sys_final" ] && [ -n "$jem_final" ] && [ -n "$mim_final" ]; then
            jem_delta=$(awk "BEGIN{printf \"%.1f\", $jem_final - $sys_final}")
            mim_delta=$(awk "BEGIN{printf \"%.1f\", $mim_final - $sys_final}")
            echo "| Final RSS | ${sys_final} MB | ${jem_final} MB | ${mim_final} MB | ${jem_delta} MB | ${mim_delta} MB |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -n "$sys_peak" ] && [ -n "$jem_peak" ] && [ -n "$mim_peak" ]; then
            jem_delta=$(awk "BEGIN{printf \"%.1f\", $jem_peak - $sys_peak}")
            mim_delta=$(awk "BEGIN{printf \"%.1f\", $mim_peak - $sys_peak}")
            echo "| Peak RSS | ${sys_peak} MB | ${jem_peak} MB | ${mim_peak} MB | ${jem_delta} MB | ${mim_delta} MB |" >> $GITHUB_STEP_SUMMARY
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: allocator-compare-data
          path: |
            sys.csv
            sys.log
            sys.time
            jem.csv
            jem.log
            jem.time
            mim.csv
            mim.log
            mim.time
            compare.csv
