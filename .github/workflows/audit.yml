name: Security Audit

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "frontend/package-lock.json"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "frontend/package-lock.json"
      - ".github/workflows/audit.yml"
  schedule:
    # Daily re-check against the latest advisory DBs (push only fires on lock changes)
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  checks: write # rustsec/audit-check creates a status check (marked failed when advisories found)
  issues: write # schedule mode: rustsec/audit-check creates an issue for new advisories

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Cargo audit (RustSec advisory DB)
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: NPM audit
        working-directory: frontend
        run: npm audit --audit-level=high
