[package]
name = "rustracker"
version = "0.2.34"
edition = "2021"
description = "A minimal HTTP BitTorrent tracker written in Rust"
license = "MIT"

[features]
default = ["dashboard"]
dashboard = []
personal-contact = []

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["tokio", "http1"] }
axum-server = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.38", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = { version = "0.7", features = ["background_threads"] }

[dev-dependencies]
http-body-util = "0.1"
mimalloc = "0.1"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
