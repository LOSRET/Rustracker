name: Benchmark

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --example unified_bench
      - name: Run
        run: cargo run --release --example unified_bench 2>bench.log | tee bench.csv
      - name: Show log
        run: cat bench.log
      - name: Summary
        run: |
          echo "# Unified Benchmark (memory + RPS, same tracker)" >> $GITHUB_STEP_SUMMARY
          echo "| Requests | Peers | New Joins | Re-announces | RPS | RSS |" >> $GITHUB_STEP_SUMMARY
          echo "|---:|---:|---:|---:|---:|---:|" >> $GITHUB_STEP_SUMMARY
          tail -n +2 bench.csv | while IFS=',' read req peers new re rps rss; do
            echo "| $(printf "%'d" $req) | $(printf "%'d" $peers) | $(printf "%'d" $new) | $(printf "%'d" $re) | $(printf "%'.0f" $rps) | ${rss} MB |" >> $GITHUB_STEP_SUMMARY
          done
      - uses: actions/upload-artifact@v4
        with: { name: benchmark, path: bench.csv }
